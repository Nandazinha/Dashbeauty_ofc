<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DashBeauty</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Voltar</a>
            
            <div class="auth-logo">
                <i class="fas fa-spa"></i>
                <h2>Bem-vindo de volta</h2>
                <p>Entre com sua conta para continuar</p>
            </div>

            <div class="role-selector">
                <button class="role-btn active" data-role="client">Cliente</button>
                <button class="role-btn" data-role="business">Empresa</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="seu@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                        <i class="fas fa-eye-slash toggle-password"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-block">Entrar</button>
            </form>

            <div class="auth-footer">
                <p>Não tem conta? <a href="register.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="js/api.js"></script>
    <script>
        let selectedRole = 'client';

        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedRole = this.dataset.role;
            });
        });

        document.querySelector('.toggle-password').addEventListener('click', function() {
            const input = document.getElementById('login-password');
            if (input.type === 'password') {
                input.type = 'text';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                input.type = 'password';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                showToast('Preencha todos os campos', 'error');
                return;
            }
            
            const result = await API.login(email, password);
            
            if (result.success) {
                const userType = result.data.user_type;
                
                if (userType !== selectedRole) {
                    showToast(`Esta conta é de ${userType === 'client' ? 'cliente' : 'empresa'}`, 'error');
                    return;
                }
                
                showToast('Login realizado com sucesso!', 'success');
                
                setTimeout(() => {
                    if (userType === 'business') {
                        window.location.href = 'business.html';
                    } else {
                        window.location.href = 'client.html';
                    }
                }, 1000);
            } else {
                showToast(result.message || 'Erro ao fazer login', 'error');
            }
        });
    </script>
</body>
</html>
